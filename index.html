<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lock Widgets</title>
<meta name="theme-color" content="#0b0d1a">
<script>
  // Runs before first paint so widget mode never flashes an opaque background.
  (function(){
    var w=(new URLSearchParams(location.search).get('w')||'').toLowerCase();
    var tiny=innerHeight<=240&&innerWidth<=520;
    if(['rect','circle','moon','week','month','weather'].indexOf(w)>-1||(!w&&tiny)){
      var root=document.documentElement, bg=(new URLSearchParams(location.search).get('bg')||'').toLowerCase();
      root.classList.add('widget');
      // Lock screen widgets: iOS renders them in vibrant mode, where brightness becomes opacity,
      // so pure black is fully see-through while white turns into frosted glass.
      // Home screen widget (month): a dark surface, since black there is just black.
      // ?bg=clear keeps a true alpha background, ?bg=black forces black.
      if(bg==='black'||(bg!=='clear'&&w!=='month'&&w!=='weather')) root.classList.add('lock');
      else if(bg!=='clear') root.classList.add('home');
      var m=document.querySelector('meta[name="theme-color"]'); if(m) m.remove();
    }
  })();
</script>
<style>
  :root{
    --ink:#ffffff;
    --font: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);-webkit-font-smoothing:antialiased;color:var(--ink)}

  /* ---------- WIDGET MODE ---------- */
  html.widget,html.widget body,body.widget{
    background:transparent!important;background-color:rgba(0,0,0,0)!important;background-image:none!important;
    color-scheme:only light;overflow:hidden}
  html.widget *{box-shadow:none!important;text-shadow:none!important}
  html.widget.lock,html.widget.lock body{background:#000!important;background-color:#000!important}
  html.widget.home,html.widget.home body{background-color:#0d0e1c!important;
    background-image:radial-gradient(110% 120% at 0% 0%,var(--g1,rgba(122,101,255,.32)) 0%,transparent 55%),
      radial-gradient(90% 110% at 100% 100%,var(--g2,rgba(17,163,156,.22)) 0%,transparent 60%)!important}

  /* weather (home screen, medium) */
  .stage.wx{width:338px;height:158px}
  .wx .side{position:absolute;left:18px;top:16px;bottom:16px;width:116px;display:flex;flex-direction:column}
  .wx .loc{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    opacity:.65;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wx .loc svg{width:10px;height:10px;flex:none}
  .wx .big{font-size:50px;font-weight:700;letter-spacing:-.045em;line-height:.88;margin-top:7px;font-variant-numeric:tabular-nums}
  .wx .cond{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;margin-top:6px;line-height:1.1;white-space:nowrap}
  .wx .cond svg{width:17px;height:17px;flex:none}
  .wx .hl{margin-top:auto;font-size:10.5px;font-weight:600;opacity:.6;display:flex;gap:8px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .wx .right{position:absolute;left:146px;right:14px;top:14px;bottom:12px;display:flex;flex-direction:column;justify-content:space-between}
  .wx .hours{display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:8px;border-bottom:1px solid color-mix(in srgb,var(--ink) 14%,transparent)}
  .wx .hr{display:flex;flex-direction:column;align-items:center;gap:5px;line-height:1}
  .wx .hr span{font-size:9.5px;font-weight:700;opacity:.55;letter-spacing:.02em}
  .wx .hr svg{width:18px;height:18px}
  .wx .hr b{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
  .wx .days{display:flex;flex-direction:column;gap:5px}
  .wx .dy{display:grid;grid-template-columns:30px 16px 26px 1fr 26px;align-items:center;gap:4px;font-size:11px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
  .wx .dy svg{width:14px;height:14px}
  .wx .dy .mn{opacity:.55;text-align:right}
  .wx .dy .mx{text-align:right}
  .wx .rng{position:relative;height:4px;border-radius:2px;background:color-mix(in srgb,var(--ink) 16%,transparent)}
  .wx .rng i{position:absolute;top:0;bottom:0;border-radius:2px;background:var(--ink)}
  .wx .empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:600;opacity:.7}
  .wx .empty svg{width:28px;height:28px}

  /* week strip (lock screen, rectangular) */
  .stage.week{width:170px;height:76px}
  .week .hd{position:absolute;left:4px;right:4px;top:4px;display:flex;justify-content:space-between;align-items:baseline;
    font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;line-height:1}
  .week .hd span+span{opacity:.6}
  .week .days{position:absolute;left:0;right:0;top:21px;bottom:2px;display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .week .d{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:12px;line-height:1}
  .week .d b{font-size:8.5px;font-weight:700;letter-spacing:.04em;opacity:.6}
  .week .d i{font-style:normal;font-size:16px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .week .d.past{opacity:.42}
  .week .d.today{background:var(--ink);color:#000}
  .week .d.today b{opacity:.7}

  /* month (home screen, medium) */
  .stage.month{width:338px;height:158px}
  .month .side{position:absolute;left:18px;top:16px;bottom:16px;width:104px;display:flex;flex-direction:column}
  .month .wd{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.65;line-height:1}
  .month .big{font-size:50px;font-weight:700;letter-spacing:-.045em;line-height:.88;margin-top:7px;font-variant-numeric:tabular-nums}
  .month .my{font-size:13.5px;font-weight:600;margin-top:5px;line-height:1}
  .month .my span{opacity:.55;font-weight:600}
  .month .foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;font-size:10px;font-weight:600;line-height:1}
  .month .foot .mn{display:flex;align-items:center;gap:5px;opacity:.85}
  .month .foot svg{width:12px;height:12px;flex:none}
  .month .bar{height:4px;border-radius:2px;background:color-mix(in srgb,var(--ink) 20%,transparent);overflow:hidden}
  .month .bar i{display:block;height:100%;border-radius:2px;background:var(--ink)}
  .month .yl{display:flex;justify-content:space-between;opacity:.6;font-size:9.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .month .grid{position:absolute;left:132px;right:14px;top:14px;bottom:12px;display:flex;flex-direction:column;justify-content:center;gap:1px}
  .month .r{display:grid;grid-template-columns:repeat(7,1fr);height:19px;align-items:center;justify-items:center}
  .month .r.h{height:16px;font-size:9px;font-weight:700;letter-spacing:.06em;opacity:.5}
  .month .c{width:21px;height:19px;display:flex;align-items:center;justify-content:center;border-radius:10px;
    font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
  .month .c.sun{opacity:.6}
  .month .c.past{opacity:.35}
  .month .c.today{background:var(--ink);color:#12101f;font-weight:800;opacity:1}
  .viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  .stage{position:relative;flex:none;transform-origin:center center;color:var(--ink)}
  .stage.rect{width:170px;height:76px}
  .stage.circle,.stage.moon{width:76px;height:76px}

  .ring{position:absolute}
  .ring circle{fill:none;stroke:currentColor}
  .ring .track{opacity:.22}
  .ring .bar{stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}

  /* rect */
  .rect .ring{left:2px;top:6px;width:64px;height:64px}
  .rect .ringlabel{position:absolute;left:2px;top:6px;width:64px;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
  .rect .pct{font-size:19px;font-weight:700;letter-spacing:-.02em}
  .rect .pct small{font-size:10px;font-weight:600;opacity:.8;margin-left:1px}
  .rect .yr{font-size:7.5px;font-weight:600;letter-spacing:.08em;opacity:.65;margin-top:3px;text-transform:uppercase}
  .rect .col{position:absolute;left:76px;right:0;top:7px;bottom:6px;display:flex;flex-direction:column;justify-content:space-between}
  .rect .wd{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;opacity:.7}
  .rect .dt{font-size:21px;font-weight:700;letter-spacing:-.02em;line-height:1;white-space:nowrap}
  .rect .dt span{font-size:13px;font-weight:600;opacity:.85;letter-spacing:0}
  .rect .meta{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:600;opacity:.85;white-space:nowrap}
  .rect .meta svg{width:13px;height:13px;flex:none}
  .rect .meta .dot{opacity:.45}

  /* circle */
  .circle .ring,.moon .ring{inset:0;width:76px;height:76px}
  .circle .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
  .circle .day{font-size:28px;font-weight:700;letter-spacing:-.03em}
  .circle .mon{font-size:10px;font-weight:700;letter-spacing:.12em;opacity:.7;margin-top:2px;text-transform:uppercase}

  /* moon */
  .moon .disc{position:absolute;left:15px;top:8px;width:46px;height:46px}
  .moon .lbl{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:10px;font-weight:700;letter-spacing:.04em;opacity:.8}

  /* ---------- PREVIEW MODE ---------- */
  body.preview{
    background:#0b0d1a;
    min-height:100%;
    color:#f4f5fb;
  }
  .wall{
    position:fixed;inset:0;z-index:-1;
    background:
      radial-gradient(60% 45% at 18% 12%, #6a3df0 0%, transparent 70%),
      radial-gradient(55% 40% at 88% 30%, #0fb9b1 0%, transparent 70%),
      radial-gradient(70% 55% at 50% 100%, #ef5f8b 0%, transparent 72%),
      linear-gradient(180deg,#14112b,#0b0d1a);
    filter:saturate(1.1);
  }
  .wall::after{content:"";position:absolute;inset:0;backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px)}
  main{max-width:520px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 16px 48px}
  .lock{text-align:center;padding:18px 0 8px}
  .lock .ldate{font-size:19px;font-weight:600;opacity:.92}
  .lock .ltime{font-size:clamp(76px,24vw,104px);font-weight:700;letter-spacing:-.04em;line-height:1;margin-top:2px;
    background:linear-gradient(180deg,#fff, rgba(255,255,255,.78));-webkit-background-clip:text;background-clip:text;color:transparent}
  .row{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:14px}
  .row iframe{border:0;background:transparent;display:block;color-scheme:normal}
  .glass{border-radius:22px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
    backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3)}
  .card{margin-top:28px;padding:18px}
  h1{font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin-bottom:12px}
  .url{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 12px;border-radius:14px;background:rgba(0,0,0,.25);margin-top:8px}
  .url .tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:8px;background:rgba(255,255,255,.14);flex:none}
  .url code{flex:1;min-width:0;font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace;opacity:.9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .url button{flex:none;font:600 13px var(--font);color:#0b0d1a;background:#fff;border:0;border-radius:10px;padding:8px 12px;cursor:pointer}
  .url button.ok{background:#7ef0c6}
  ol{padding-left:20px;display:grid;gap:9px;font-size:14.5px;line-height:1.45;opacity:.92}
  .opts{display:grid;gap:8px;font-size:14px;line-height:1.45;opacity:.9}
  .opts code{font:12.5px ui-monospace,Menlo,monospace;background:rgba(255,255,255,.12);padding:2px 6px;border-radius:6px}
  body.preview .foot{text-align:center;font-size:12px;opacity:.5;margin-top:24px}
  .homemock{margin-top:28px;display:flex;flex-direction:column;align-items:center;gap:12px}
  .homemock .cap{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.6}
  .homemock .hw{display:block;border:0;width:100%;max-width:338px;aspect-ratio:338/158;border-radius:22px;
    box-shadow:0 10px 30px rgba(0,0,0,.35)}
</style>
</head>
<body>
<script>
(function(){
  const qs = new URLSearchParams(location.search);
  let mode = (qs.get('w')||'').toLowerCase();
  // No ?w= given but the viewport is widget-sized: pick a layout from its shape.
  if(!mode && innerHeight<=240 && innerWidth<=520) mode = innerWidth/innerHeight>=1.6 ? 'rect' : 'circle';
  const color = qs.get('c');
  const north = (qs.get('hemi')||'s').toLowerCase().startsWith('n');
  if(color && /^[0-9a-f]{3,8}$/i.test(color)) document.documentElement.style.setProperty('--ink','#'+color);

  /* ---------- data ---------- */
  const SYNODIC = 29.530588853;
  const NEW_MOON_REF = Date.UTC(2000,0,6,18,14); // known new moon
  function moonInfo(d){
    const days = (d.getTime()-NEW_MOON_REF)/864e5;
    const p = ((days % SYNODIC)+SYNODIC)%SYNODIC / SYNODIC; // 0..1
    const illum = (1-Math.cos(2*Math.PI*p))/2;
    const names=['Lua nova','Crescente','Quarto crescente','Crescente gibosa','Lua cheia','Minguante gibosa','Quarto minguante','Minguante'];
    const idx = Math.floor((p*8)+0.5)%8;
    // Short labels for the narrow rectangular widget; the icon already shows waxing vs waning.
    const short=['Lua nova','Crescente','Quarto cresc.','Gibosa','Lua cheia','Gibosa','Quarto ming.','Minguante'];
    return {p, illum, name:names[idx], short:short[idx]};
  }
  function moonSVG(p, size, strokeW){
    const r=50, cx=50, cy=50;
    const k=Math.cos(2*Math.PI*p);
    const rx=Math.abs(k)*r;
    const waxing=p<0.5;
    let d;
    if(waxing){
      d=`M${cx},${cy-r} A${r},${r} 0 0 1 ${cx},${cy+r} A${rx},${r} 0 0 ${k>0?0:1} ${cx},${cy-r}Z`;
    }else{
      d=`M${cx},${cy-r} A${r},${r} 0 0 0 ${cx},${cy+r} A${rx},${r} 0 0 ${k>0?1:0} ${cx},${cy-r}Z`;
    }
    const flip = north ? '' : ` transform="translate(100 0) scale(-1 1)"`; // southern hemisphere view
    return `<svg viewBox="-4 -4 108 108" width="${size}" height="${size}" aria-hidden="true">
      <circle cx="50" cy="50" r="50" fill="currentColor" opacity=".18"/>
      <g${flip}><path d="${d}" fill="currentColor"/></g>
      <circle cx="50" cy="50" r="50" fill="none" stroke="currentColor" stroke-width="${strokeW}" opacity=".5"/>
    </svg>`;
  }
  function isoWeek(d){
    const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
    const day=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-day);
    const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));
    return Math.ceil(((t-y0)/864e5+1)/7);
  }
  function ring(pct, stroke){
    const r=50-stroke/2;
    return `<svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
      <circle class="track" cx="50" cy="50" r="${r}" stroke-width="${stroke}"/>
      <circle class="bar" cx="50" cy="50" r="${r}" stroke-width="${stroke}" pathLength="100"
        stroke-dasharray="${Math.max(pct,0.5).toFixed(2)} 100"/>
    </svg>`;
  }
  function info(){
    const now=new Date();
    const y=now.getFullYear();
    const y0=new Date(y,0,1), y1=new Date(y+1,0,1);
    const yearPct=(now-y0)/(y1-y0)*100;
    const dim=new Date(y,now.getMonth()+1,0).getDate();
    const monthPct=((now.getDate()-1)+(now.getHours()*60+now.getMinutes())/1440)/dim*100;
    const weekday=new Intl.DateTimeFormat('pt-BR',{weekday:'long'}).format(now).replace(/-feira$/,'');
    const monthLong=new Intl.DateTimeFormat('pt-BR',{month:'long'}).format(now);
    const monthShort=monthLong.slice(0,3);
    return {now,y,yearPct,monthPct,weekday,monthLong,monthShort,day:now.getDate(),week:isoWeek(now),moon:moonInfo(now)};
  }

  const DOW=['D','S','T','Q','Q','S','S']; // Brazilian calendars start on Sunday
  function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}
  function weekHTML(i){
    const now=i.now, start=new Date(now.getFullYear(),now.getMonth(),now.getDate()-now.getDay());
    let cells='';
    for(let k=0;k<7;k++){
      const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+k);
      const cls=sameDay(d,now)?'today':(d<now?'past':'');
      cells+=`<div class="d ${cls}"><b>${DOW[k]}</b><i>${d.getDate()}</i></div>`;
    }
    return `<div class="stage week" role="img" aria-label="Semana ${i.week}, hoje ${i.day} de ${i.monthLong}">
      <div class="hd"><span>${i.monthLong}</span><span>Sem ${i.week}</span></div>
      <div class="days">${cells}</div></div>`;
  }
  function monthHTML(i){
    const now=i.now, y=now.getFullYear(), m=now.getMonth();
    const offset=new Date(y,m,1).getDay(), dim=new Date(y,m+1,0).getDate();
    const cells=[];
    for(let k=0;k<offset;k++) cells.push('<div class="c"></div>');
    for(let d=1;d<=dim;d++){
      const dow=(offset+d-1)%7;
      const cls=d===i.day?'today':(d<i.day?'past':(dow===0?'sun':''));
      cells.push(`<div class="c ${cls}">${d}</div>`);
    }
    while(cells.length%7) cells.push('<div class="c"></div>');
    let rows=`<div class="r h">${DOW.map(x=>`<span>${x}</span>`).join('')}</div>`;
    for(let k=0;k<cells.length;k+=7) rows+=`<div class="r">${cells.slice(k,k+7).join('')}</div>`;
    const daysLeft=Math.round((new Date(y+1,0,1)-new Date(y,m,i.day))/864e5)-1;
    return `<div class="stage month" role="img" aria-label="${i.weekday}, ${i.day} de ${i.monthLong} de ${i.y}">
      <div class="side">
        <div class="wd">${i.weekday}</div>
        <div class="big">${i.day}</div>
        <div class="my">${i.monthLong} <span>${i.y}</span></div>
        <div class="foot">
          <div class="mn">${moonSVG(i.moon.p,12,4)}<span>${i.moon.short}</span></div>
          <div class="bar"><i style="width:${i.yearPct.toFixed(1)}%"></i></div>
          <div class="yl"><span>${Math.floor(i.yearPct)}% do ano</span><span>${daysLeft} dias</span></div>
        </div>
      </div>
      <div class="grid">${rows}</div></div>`;
  }

  /* ---------- weather (Open-Meteo, no key) ---------- */
  const WKEY='ww.weather.v1';
  const DEFAULT_LOC={lat:-23.55,lon:-46.63,name:'São Paulo'};
  let W=null;
  try{ W=JSON.parse(localStorage.getItem(WKEY)||'null'); }catch(e){}

  // WMO weather code -> icon + labels (long for home, short for the lock screen)
  function wmo(code,day){
    const c=+code;
    if(c===0) return {k:day?'sun':'moon',l:day?'Céu limpo':'Noite limpa',s:'Limpo',g:day?['rgba(255,170,60,.34)','rgba(60,140,255,.30)']:['rgba(90,80,220,.36)','rgba(20,60,150,.30)']};
    if(c<=2)  return {k:day?'psun':'pmoon',l:c===1?'Quase limpo':'Parcialmente nublado',s:c===1?'Quase limpo':'Parc. nublado',g:day?['rgba(255,190,110,.26)','rgba(90,150,230,.28)']:['rgba(100,90,210,.30)','rgba(40,70,140,.26)']};
    if(c===3) return {k:'cloud',l:'Nublado',s:'Nublado',g:['rgba(150,160,190,.24)','rgba(80,100,140,.24)']};
    if(c===45||c===48) return {k:'fog',l:'Neblina',s:'Neblina',g:['rgba(170,170,190,.22)','rgba(110,120,140,.20)']};
    if(c>=51&&c<=57) return {k:'drizzle',l:'Garoa',s:'Garoa',g:['rgba(80,140,210,.28)','rgba(30,150,160,.20)']};
    if((c>=61&&c<=67)||(c>=80&&c<=82)) return {k:'rain',l:c>=80?'Pancadas de chuva':'Chuva',s:c>=80?'Pancadas':'Chuva',g:['rgba(60,120,210,.34)','rgba(30,160,170,.22)']};
    if((c>=71&&c<=77)||c===85||c===86) return {k:'snow',l:'Neve',s:'Neve',g:['rgba(200,220,255,.28)','rgba(120,160,220,.24)']};
    if(c>=95) return {k:'storm',l:'Tempestade',s:'Tempestade',g:['rgba(150,80,230,.36)','rgba(40,40,130,.30)']};
    return {k:'cloud',l:'—',s:'—',g:null};
  }
  // Line icons on a 24 grid, drawn in the widget ink.
  const CLOUD='M17.5 19H8a5 5 0 1 1 1.1-9.88A6 6 0 0 1 20.5 12a3.6 3.6 0 0 1-3 7z';
  function wxIcon(k,size){
    const sun='<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>';
    const moon='<path d="M19.5 14.6A8 8 0 0 1 9.4 4.5a8 8 0 1 0 10.1 10.1z"/>';
    const up=`<path d="${CLOUD}" transform="translate(0 -3)"/>`;
    const body={
      sun, moon,
      psun:'<circle cx="8" cy="8" r="2.8"/><path d="M8 2.2v1.3M2.2 8h1.3M3.9 3.9l.9.9M12.1 3.9l-.9.9"/><path d="'+CLOUD+'" transform="translate(1.5 1.5) scale(.92)"/>',
      pmoon:'<path d="M11.2 7.6A4.3 4.3 0 0 1 5.8 2.2a4.3 4.3 0 1 0 5.4 5.4z"/><path d="'+CLOUD+'" transform="translate(1.5 1.5) scale(.92)"/>',
      cloud:`<path d="${CLOUD}" transform="translate(0 -1)"/>`,
      fog:`<path d="${CLOUD}" transform="translate(2 -4) scale(.85)"/><path d="M4 18h16M7 21.5h10"/>`,
      drizzle:up+'<path d="M8.5 19.5v.01M12.5 20.5v.01M16.5 19.5v.01M10.5 22.5v.01M14.5 22.5v.01"/>',
      rain:up+'<path d="M9 18.5l-1 3M13 18.5l-1 3M17 18.5l-1 3"/>',
      snow:up+'<path d="M8.5 19.5v.01M12.5 19.5v.01M16.5 19.5v.01M10.5 22v.01M14.5 22v.01"/>',
      storm:up+'<path d="M13 15.5l-2.5 3.5h3.5l-2.5 3.5"/>',
      pin:'<path d="M12 21s-6-5.6-6-10.5a6 6 0 0 1 12 0C18 15.4 12 21 12 21z"/><circle cx="12" cy="10.5" r="2"/>'
    }[k]||'';
    return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;
  }
  const r0=n=>Math.round(n);

  function locFromParams(){
    const lat=parseFloat(qs.get('lat')), lon=parseFloat(qs.get('lon'));
    if(isFinite(lat)&&isFinite(lon)) return {lat,lon,name:qs.get('name')||null};
    return null;
  }
  async function locate(){
    const p=locFromParams(); if(p) return p;
    const city=qs.get('city');
    if(city){
      const cached=W&&W.loc&&W.loc.q===city.toLowerCase()?W.loc:null;
      if(cached) return cached;
      const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=pt&name='+encodeURIComponent(city));
      const g=(await r.json()).results?.[0];
      if(g) return {lat:g.latitude,lon:g.longitude,name:g.name,q:city.toLowerCase()};
    }
    try{
      const pos=await new Promise((res,rej)=>{
        if(!navigator.geolocation) return rej();
        navigator.geolocation.getCurrentPosition(res,rej,{timeout:5000,maximumAge:30*60e3});
      });
      return {lat:pos.coords.latitude,lon:pos.coords.longitude,name:null};
    }catch(e){}
    if(W&&W.loc) return W.loc;
    return DEFAULT_LOC;
  }
  async function placeName(loc){
    if(loc.name) return loc.name;
    // Reuse the cached name if we have not moved more than ~5 km.
    if(W&&W.loc&&W.loc.name&&Math.abs(W.loc.lat-loc.lat)<.05&&Math.abs(W.loc.lon-loc.lon)<.05) return W.loc.name;
    try{
      const r=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${loc.lat}&longitude=${loc.lon}&localityLanguage=pt`);
      const j=await r.json();
      return j.city||j.locality||j.principalSubdivision||'';
    }catch(e){ return ''; }
  }
  let loading=null;
  function loadWeather(){
    if(loading) return loading;
    loading=(async()=>{
      try{
        const loc=await locate();
        loc.name=await placeName(loc);
        const url='https://api.open-meteo.com/v1/forecast?latitude='+loc.lat.toFixed(3)+'&longitude='+loc.lon.toFixed(3)+
          '&current=temperature_2m,apparent_temperature,weather_code,is_day'+
          '&hourly=temperature_2m,weather_code,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min'+
          '&timezone=auto&forecast_days=4';
        const d=await (await fetch(url)).json();
        const floor=d.current.time.slice(0,13)+':00';
        let hi=d.hourly.time.indexOf(floor); if(hi<0) hi=0;
        const hours=[];
        for(let k=1;k<=4;k++){
          const j=hi+k; if(j>=d.hourly.time.length) break;
          hours.push({h:+d.hourly.time[j].slice(11,13),t:d.hourly.temperature_2m[j],c:d.hourly.weather_code[j],day:d.hourly.is_day[j]});
        }
        const days=[];
        for(let k=1;k<d.daily.time.length&&days.length<3;k++){
          days.push({d:d.daily.time[k],c:d.daily.weather_code[k],max:d.daily.temperature_2m_max[k],min:d.daily.temperature_2m_min[k]});
        }
        W={loc,at:Date.now(),
          cur:{t:d.current.temperature_2m,f:d.current.apparent_temperature,c:d.current.weather_code,day:d.current.is_day},
          today:{max:d.daily.temperature_2m_max[0],min:d.daily.temperature_2m_min[0]},hours,days};
        try{ localStorage.setItem(WKEY,JSON.stringify(W)); }catch(e){}
      }catch(e){ /* keep the cached reading */ }
      loading=null;
      if(document.getElementById('vp')) renderWidget();
    })();
    return loading;
  }

  function rectWeather(){
    if(!W) return `${wxIcon('cloud',13)}<span>—°</span><span class="cond">Clima</span>`;
    const m=wmo(W.cur.c,W.cur.day);
    return `${wxIcon(m.k,13)}<span>${r0(W.cur.t)}°</span><span class="cond">${m.s}</span>`;
  }
  function weatherHTML(){
    if(!W) return `<div class="stage wx"><div class="empty">${wxIcon('psun',28)}<span>Carregando o clima…</span></div></div>`;
    const m=wmo(W.cur.c,W.cur.day);
    if(m.g){ document.documentElement.style.setProperty('--g1',m.g[0]); document.documentElement.style.setProperty('--g2',m.g[1]); }
    const hours=[`<div class="hr"><span>Agora</span>${wxIcon(m.k,18)}<b>${r0(W.cur.t)}°</b></div>`]
      .concat(W.hours.map(h=>`<div class="hr"><span>${h.h}h</span>${wxIcon(wmo(h.c,h.day).k,18)}<b>${r0(h.t)}°</b></div>`)).join('');
    const lo=Math.min(...W.days.map(d=>d.min)), hi=Math.max(...W.days.map(d=>d.max)), span=Math.max(hi-lo,1);
    const days=W.days.map(d=>{
      const name=new Intl.DateTimeFormat('pt-BR',{weekday:'short'}).format(new Date(d.d+'T12:00')).replace('.','');
      const a=(d.min-lo)/span*100, b=(d.max-lo)/span*100;
      return `<div class="dy"><span>${name.charAt(0).toUpperCase()+name.slice(1)}</span>${wxIcon(wmo(d.c,1).k,14)}
        <span class="mn">${r0(d.min)}°</span><div class="rng"><i style="left:${a.toFixed(1)}%;right:${(100-b).toFixed(1)}%"></i></div><span class="mx">${r0(d.max)}°</span></div>`;
    }).join('');
    return `<div class="stage wx" role="img" aria-label="${W.loc.name||''} ${r0(W.cur.t)} graus, ${m.l}">
      <div class="side">
        <div class="loc">${wxIcon('pin',10)}<span>${W.loc.name||'Aqui'}</span></div>
        <div class="big">${r0(W.cur.t)}°</div>
        <div class="cond">${wxIcon(m.k,17)}<span>${m.l}</span></div>
        <div class="hl"><span>Máx ${r0(W.today.max)}°</span><span>Mín ${r0(W.today.min)}°</span></div>
      </div>
      <div class="right"><div class="hours">${hours}</div><div class="days">${days}</div></div></div>`;
  }

  /* ---------- widget mode ---------- */
  function renderWidget(){
    const i=info();
    let html='';
    if(mode==='week'){
      html=weekHTML(i);
    }else if(mode==='weather'){
      html=weatherHTML();
    }else if(mode==='month'){
      html=monthHTML(i);
    }else if(mode==='circle'){
      html=`<div class="stage circle">${ring(i.monthPct,9)}
        <div class="center"><div class="day">${i.day}</div><div class="mon">${i.monthShort}</div></div></div>`;
    }else if(mode==='moon'){
      html=`<div class="stage moon"><div class="disc">${moonSVG(i.moon.p,46,2.5)}</div>
        <div class="lbl">${Math.round(i.moon.illum*100)}%</div></div>`;
    }else{
      html=`<div class="stage rect">${ring(i.yearPct,8.5)}
        <div class="ringlabel"><div class="pct">${Math.floor(i.yearPct)}<small>%</small></div><div class="yr">${i.y}</div></div>
        <div class="col">
          <div class="wd">${i.weekday}</div>
          <div class="dt">${i.day} <span>${i.monthLong}</span></div>
          <div class="meta">${rectWeather()}<span class="dot wk">·</span><span class="wk">Sem ${i.week}</span></div>
        </div></div>`;
    }
    document.getElementById('vp').innerHTML=html;
    fit();
  }
  function fit(){
    // Drop the week label if the meta row would be clipped.
    const meta=document.querySelector('.rect .meta');
    const clipped=()=>meta && meta.scrollWidth>meta.clientWidth+0.5;
    if(clipped()) meta.querySelectorAll('.wk').forEach(e=>e.remove());
    if(meta){ let f=10; while(clipped()&&f>8.5){ f-=.5; meta.style.fontSize=f+'px'; } }
    if(clipped()) meta.querySelectorAll('.cond').forEach(e=>e.remove());
    const cond=document.querySelector('.wx .cond');
    if(cond){ let f=13.5; while(cond.scrollWidth>cond.clientWidth+0.5&&f>10){ f-=.5; cond.style.fontSize=f+'px'; } }
    const s=document.querySelector('.stage'); if(!s) return;
    const w=s.offsetWidth,h=s.offsetHeight;
    const k=Math.min(innerWidth/w, innerHeight/h);
    s.style.transform=`scale(${k})`;
  }

  /* ---------- preview mode ---------- */
  function renderPreview(){
    document.body.className='preview';
    const base=location.origin+location.pathname;
    const urls=[
      {tag:'Retangular',q:'?w=rect',desc:'Progresso do ano, data, clima e semana'},
      {tag:'Circular',q:'?w=circle',desc:'Dia do mês com anel de progresso do mês'},
      {tag:'Lua',q:'?w=moon',desc:'Fase da lua com % iluminada'},
      {tag:'Semana',q:'?w=week',desc:'Bloqueio, retangular: semana atual com hoje destacado'},
      {tag:'Calendário',q:'?w=month',desc:'Tela inicial, médio: mês inteiro, data e progresso do ano'},
      {tag:'Clima',q:'?w=weather',desc:'Tela inicial, médio: agora, próximas horas e 3 dias'}
    ];
    document.body.innerHTML=`
      <div class="wall"></div>
      <main>
        <section class="lock">
          <div class="ldate" id="ldate"></div>
          <div class="ltime" id="ltime"></div>
          <div class="row">
            <iframe src="${base}?w=rect&bg=clear" width="170" height="76" title="Widget retangular" allowtransparency="true"></iframe>
            <iframe src="${base}?w=week&bg=clear" width="170" height="76" title="Widget semana" allowtransparency="true"></iframe>
            <iframe src="${base}?w=circle&bg=clear" width="76" height="76" title="Widget circular" allowtransparency="true"></iframe>
            <iframe src="${base}?w=moon&bg=clear" width="76" height="76" title="Widget lua" allowtransparency="true"></iframe>
          </div>
        </section>

        <section class="homemock">
          <div class="cap">Tela inicial</div>
          <iframe class="hw" src="${base}?w=weather" title="Widget clima"></iframe>
          <iframe class="hw" src="${base}?w=month" title="Widget calendário"></iframe>
        </section>

        <section class="card glass">
          <h1>URLs dos widgets</h1>
          ${urls.map(u=>`
            <div class="url">
              <span class="tag">${u.tag}</span>
              <code title="${u.desc}">${base}${u.q}</code>
              <button data-u="${base}${u.q}">Copiar</button>
            </div>`).join('')}
        </section>

        <section class="card glass">
          <h1>Como usar no Widget Web 27</h1>
          <ol>
            <li>Copie uma das URLs acima e crie um novo widget no app colando o link.</li>
            <li>Na tela de bloqueio o fundo preto da página aparece transparente. Se surgir um vidro fosco, desative o <b>fundo transparente</b> do app.</li>
            <li>Tela de bloqueio: toque e segure → <b>Personalizar</b> → adicione o Widget Web no tamanho certo: retangular para <code style="font-size:12px">rect</code> e <code style="font-size:12px">week</code>, circular para <code style="font-size:12px">circle</code> e <code style="font-size:12px">moon</code>.</li>
            <li>Tela inicial: adicione o Widget Web no tamanho <b>médio</b> com a URL <code style="font-size:12px">month</code> ou <code style="font-size:12px">weather</code>.</li>
            <li>Clima: permita a localização no app. Se ele não tiver acesso, use <code style="font-size:12px">&amp;city=</code> com o nome da cidade.</li>
            <li>Escolha um intervalo de atualização automática (ex.: a cada hora) para manter data e lua em dia.</li>
          </ol>
        </section>

        <section class="card glass">
          <h1>Opções</h1>
          <div class="opts">
            <div><code>&amp;c=ffffff</code> muda a cor (hex sem #). Padrão: branco.</div>
            <div><code>&amp;bg=clear</code> fundo transparente de verdade; <code>&amp;bg=black</code> fundo preto.</div>
            <div><code>&amp;city=Campinas</code> ou <code>&amp;lat=-23.55&amp;lon=-46.63</code> fixa o local do clima. Sem isso, usa a localização do aparelho.</div>
            <div><code>&amp;hemi=n</code> mostra a lua como no hemisfério norte. Padrão: sul (Brasil).</div>
          </div>
        </section>
        <div class="foot">Os widgets se ajustam automaticamente a qualquer tamanho de visualização.</div>
      </main>`;
    const tick=()=>{
      const n=new Date();
      const ld=new Intl.DateTimeFormat('pt-BR',{weekday:'long',day:'numeric',month:'long'}).format(n);
      document.getElementById('ldate').textContent=ld.charAt(0).toUpperCase()+ld.slice(1);
      document.getElementById('ltime').textContent=new Intl.DateTimeFormat('pt-BR',{hour:'2-digit',minute:'2-digit'}).format(n);
    };
    tick(); setInterval(tick,10000);
    document.querySelectorAll('.url button').forEach(b=>b.addEventListener('click',async()=>{
      try{ await navigator.clipboard.writeText(b.dataset.u); b.textContent='Copiado'; b.classList.add('ok'); }
      catch(e){ prompt('Copie a URL:', b.dataset.u); }
      setTimeout(()=>{b.textContent='Copiar';b.classList.remove('ok')},1600);
    }));
  }

  if(['rect','circle','moon','week','month','weather'].includes(mode)){
    document.documentElement.classList.add('widget');
    document.body.className='widget';
    document.body.innerHTML='<div class="viewport" id="vp"></div>';
    renderWidget();
    addEventListener('resize',fit);
    setInterval(renderWidget,60000);
    if(mode==='rect'||mode==='weather'){ loadWeather(); setInterval(loadWeather,15*60e3); }
  }else{
    renderPreview();
  }
})();
</script>
</body>
</html>
